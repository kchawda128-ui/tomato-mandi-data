name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p data
          for u in https://api.data.gov.in/ https://www.data.gov.in/ https://data.gov.in/ https://agmarknet.gov.in/ https://api.agmarknet.gov.in/v1/daily-price-arrival/filters https://api.ceda.ashoka.edu.in/ https://enam.gov.in/web/ ; do
            r=$(curl -s -o /dev/null -m 25 -w "%{http_code} %{time_total}s" "$u" 2>&1 || true)
            echo "$u -> $r" | tee -a data/probe.log
          done
          echo "runner IP: $(curl -s -m 10 https://api.ipify.org)" >> data/probe.log
      - name: Save
        if: always()
        run: |
          git config user.name "tomato-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data && git commit -m "Probe $(date -u +%H:%M)" && git push
