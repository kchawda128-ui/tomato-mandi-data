name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe eNAM trade data
        run: |
          mkdir -p data
          curl -s -m 40 -X POST "https://enam.gov.in/web/Ajax_ctrl/trade_data_list" \
            -H "Content-Type: application/x-www-form-urlencoded; charset=UTF-8" -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://enam.gov.in/web/dashboard/trade-data" \
            --data "language=en&stateName=-- All --&apmcName=-- Select APMCs --&commodityName=TOMATO&fromDate=2026-10-16&toDate=2026-10-16" \
            -o data/enam_probe.json -w "%{http_code}\n" > data/probe.log 2>&1 || true
          head -c 600 data/enam_probe.json >> data/probe.log
      - name: Save
        if: always()
        run: |
          git config user.name "tomato-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data && git commit -m "Probe $(date -u +%H:%M)" && git push
