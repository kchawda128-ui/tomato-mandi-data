name: Fetch tomato mandi prices

on:
  schedule:
    - cron: "15 2 * * *"   # 7:45 am IST every day; GitHub can start scheduled jobs a little late
  workflow_dispatch:        # lets you (or Claude) run it by hand
    inputs:
      day:
        description: "Report date yyyy-mm-dd (blank = yesterday in IST)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices from data.gov.in
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          mkdir -p data
          set -o pipefail
          python -u fetch_prices.py ${{ github.event.inputs.day }} 2>&1 | tee data/last_run.log
      - name: Save to the repository
        if: always()
        run: |
          echo "finished $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST'), job status ${{ job.status }}" >> data/last_run.log
          git config user.name "tomato-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Price fetch $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git push
